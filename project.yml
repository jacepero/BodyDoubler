# XcodeGen manifest — run `xcodegen generate` on a Mac to produce BodyDouble.xcodeproj
name: BodyDouble
options:
  bundleIdPrefix: com.jacyp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.27.0"
  # Pin a specific 2026 revision before shipping — the llama.cpp C API renames
  # symbols occasionally (see README "llama.cpp API drift").
  llama:
    url: https://github.com/ggml-org/llama.cpp
    branch: master

targets:
  BodyDouble:
    type: application
    platform: iOS
    sources:
      - BodyDouble
    dependencies:
      - package: GRDB
        product: GRDB
      - package: llama
        product: llama
      - target: BodyDoubleWidgets
        embed: true
    info:
      path: BodyDouble/Info.plist
      properties:
        CFBundleDisplayName: Body Double
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: >-
          Body Double uses the microphone for push-to-talk journaling. Audio is
          transcribed on this device and never leaves it.
        NSSpeechRecognitionUsageDescription: >-
          Speech is transcribed on-device so you can narrate what you're doing.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false

  BodyDoubleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - BodyDoubleWidgets
      # Shared Live Activity attributes must compile into both targets.
      - path: BodyDouble/LiveActivity/CurrentTaskAttributes.swift
    info:
      path: BodyDoubleWidgets/Info.plist
      properties:
        CFBundleDisplayName: Body Double Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BodyDoubleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BodyDoubleTests
    dependencies:
      - target: BodyDouble
      - package: GRDB
        product: GRDB
