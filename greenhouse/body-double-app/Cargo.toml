[package]
name = "body-double-app"
version = "0.1.0"
edition = "2021"
description = "Greenhouse body double app — registered capability provider: interstitial journal, current task, loose ends and check-ins for the persistent assistant"

[[bin]]
name = "greenhouse-body-double"
path = "src/main.rs"

# Every dependency is already in the workspace lock (D4). Time zones come from
# the kernel crate's clock (the host's zone database); the journal is SQLite,
# as node-monitor's store is.
[dependencies]
greenhouse-kernel = { path = "../kernel" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
